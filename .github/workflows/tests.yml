---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      name: CLI smoke check
      task: "test ::: build"
      smoke-test: bun dist/index.js --help
      install-args: node bun
