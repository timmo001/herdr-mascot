min_version = "2025.1.0"

[tools]
node = "26.12.0"
bun = "1.4.3"
# Approved for aube's package-age check while the package is under 30 days old.
"npm:@timmo001/tooling-drift" = { version = "0.1.4", allow_low_downloads = true }

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check and verify formatting"
depends = ["lint", "typecheck", "format:check", "test"]

[tasks.test]
description = "Check directory selection and mascot asset boundaries"
depends = ["install"]
run = "bun test scripts/mascot.test.ts"

[tasks.build]
description = "Build the Bun module into dist"
depends = ["install"]
run = "bun run build"

[tasks.mascot-preview]
description = "Regenerate the README mascot pack preview"
depends = ["install"]
run = "bun scripts/mascot-preview.ts"

[tasks.test-options]
description = "Visually cycle through all six mascot positions"
depends = ["build"]
run = [
  "herdr plugin link .",
  "herdr plugin action invoke timmo.mascot.test-options",
]

[tasks."tooling:status"]
description = "Compare the reviewed Herdr release in tooling.yml with the latest"
run = "tooling-drift status"

[tasks."tooling:update"]
description = "Record a tool release as reviewed in tooling.yml after reviewing it"
usage = '''
arg "<repo>" help="Tool repository, e.g. herdrdev/herdr"
arg "<tag>" help="Release tag, e.g. v0.9.5"
'''
run = "tooling-drift update $usage_repo $usage_tag"

[tasks."tooling:publish"]
description = "Open or refresh a review pull request when a newer Herdr release is out"
run = "tooling-drift publish"
